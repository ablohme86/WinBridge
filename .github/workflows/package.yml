name: Build & Package

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            pkg-config \
            xdg-user-dirs \
            xdg-utils

      - name: Run test suite
        run: |
          make test

  package-deb-rpm:
    name: Build DEB & RPM Packages
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build & packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            pkg-config \
            rpm \
            dpkg-dev \
            desktop-file-utils \
            xdg-user-dirs \
            xdg-utils

      - name: Build DEB package
        run: |
          ./generate_release.sh --format deb

      - name: Build RPM package
        run: |
          ./generate_release.sh --format rpm

      - name: Upload DEB & RPM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: winbridge-deb-rpm-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS*
          if-no-files-found: error

  package-arch:
    name: Build Arch Package
    runs-on: ubuntu-latest
    needs: test
    container:
      image: archlinux:base-devel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arch dependencies
        run: |
          pacman -Syu --noconfirm cmake qt6-base git desktop-file-utils

      - name: Build Arch Linux package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m -u 1001 builder 2>/dev/null || useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "./generate_release.sh --format arch"

      - name: Upload Arch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: winbridge-arch-package
          path: |
            dist/*.pkg.tar.zst
            dist/SHA256SUMS*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package-deb-rpm, package-arch]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download DEB & RPM Artifacts
        uses: actions/download-artifact@v4
        with:
          name: winbridge-deb-rpm-packages
          path: dist

      - name: Download Arch Artifact
        uses: actions/download-artifact@v4
        with:
          name: winbridge-arch-package
          path: dist

      - name: Generate unified SHA256 checksums
        run: |
          cd dist
          rm -f SHA256SUMS
          sha256sum winbridge* > SHA256SUMS
          cat SHA256SUMS

      - name: Determine release version & tag
        id: release_info
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
            title="WinBridge ${{ github.ref_name }}"
          else
            version=$(grep -oP 'project\(WinBridge VERSION \K[0-9.]+' CMakeLists.txt || echo "0.2.0")
            tag="v${version}"
            title="WinBridge v${version}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

      - name: List release assets
        run: ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/SHA256SUMS*
          generate_release_notes: true
          draft: false
          prerelease: false
